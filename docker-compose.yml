# Run the whole stack locally: docker compose up --build
# Open: http://localhost:4000  (sign in with ADMIN_EMAIL / ADMIN_PASSWORD below)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: military
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    # for local development only (npm run start:dev): docker compose up db
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d military"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # local stack: dev mode (encryption keys derived from JWT_SECRET, Swagger enabled).
      # Production settings — docs/DEPLOYMENT.md
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@db:5432/military
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-0123456789}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      DB_MIGRATIONS_RUN: "true"
      STORAGE_DRIVER: local
      SIGN_WIDGET_SCRIPT_URL: ${SIGN_WIDGET_SCRIPT_URL:-}
      SIGN_WIDGET_FRAME_URL: ${SIGN_WIDGET_FRAME_URL:-}
    volumes:
      - files:/app/storage/files # frozen documents and e-signatures

  web:
    build: ./frontend
    depends_on: [api]
    environment:
      API_INTERNAL_URL: http://api:3000
      NG_ALLOWED_HOSTS: localhost
      TRUST_PROXY_HOPS: "0"
    ports:
      - "4000:4000"

volumes:
  pgdata:
  files:
