# Локальний запуск усього стеку: docker compose up --build
# Відкрити: http://localhost:4000  (вхід — ADMIN_EMAIL / ADMIN_PASSWORD нижче)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: military
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    # лише для локальної розробки (npm run start:dev): docker compose up db
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d military']
      interval: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # локальний стек: dev-режим (ключі шифрування похідні від JWT_SECRET, Swagger увімкнено).
      # Продакшн-налаштування — docs/DEPLOYMENT.md
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@db:5432/military
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-0123456789}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      DB_MIGRATIONS_RUN: 'true'
      STORAGE_DRIVER: local
      SIGN_WIDGET_SCRIPT_URL: ${SIGN_WIDGET_SCRIPT_URL:-}
      SIGN_WIDGET_FRAME_URL: ${SIGN_WIDGET_FRAME_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - outbox:/app/storage/outbox
      - files:/app/storage/files # зафіксовані документи і підписи КЕП

  web:
    build: ./frontend
    depends_on: [api]
    environment:
      API_INTERNAL_URL: http://api:3000
      NG_ALLOWED_HOSTS: localhost
      TRUST_PROXY_HOPS: '0'
    ports:
      - '4000:4000'

volumes:
  pgdata:
  outbox:
  files:
