# Weekly attack scan (OWASP ZAP) of a throw-away copy of the app built in CI — never production.
# The copy runs on an empty database with a made-up administrator; nothing real is touched.
#   baseline — the pages from the browser side: headers, cookies, CSP, what a spider finds;
#   api      — every API route from the OpenAPI description: injections, path traversal, errors.
# Findings come as a report (Actions → the run → Artifacts); a FAIL rule from .zap/rules.tsv stops the run.
name: Security scan (ZAP)

on:
  schedule:
    - cron: '17 2 * * 1' # Mondays 02:17 UTC
  workflow_dispatch:
  pull_request:
    paths: ['backend/src/auth/**', 'backend/src/security/**', 'backend/src/common/**', 'frontend/src/server.ts']

permissions:
  contents: read
  issues: write # the ZAP actions file the findings as an issue (scheduled runs)

jobs:
  zap:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: military
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/military
      JWT_SECRET: zap-only-secret-zap-only-secret-0123456789
      ADMIN_EMAIL: zap-admin@example.com
      ADMIN_PASSWORD: Zap-Scan-Only-Pass-2026!
      SWAGGER: 'true'
      PORT: '3000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: API
        working-directory: backend
        run: |
          npm ci --legacy-peer-deps
          npm run build
          nohup node dist/main.js > ../api.log 2>&1 &
      - name: Web (SSR)
        working-directory: frontend
        run: |
          npm ci
          npm run build
          API_INTERNAL_URL=http://localhost:3000 PORT=4000 NG_ALLOWED_HOSTS=localhost \
            nohup node dist/frontend/server/server.mjs > ../web.log 2>&1 &
      - name: Wait for both
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health && curl -sf -o /dev/null http://localhost:4000/login && exit 0
            sleep 2
          done
          cat api.log web.log; exit 1
      - name: ZAP baseline (pages)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:4000/login
          rules_file_name: .zap/rules.tsv
          cmd_options: '-a -I -j'
          allow_issue_writing: ${{ github.event_name == 'schedule' }}
          artifact_name: zap-baseline
      # Both ZAP actions write report_json.json / report_md.md / report_html.html into the workspace from inside their
      # container (another user): the second one cannot overwrite the files of the first and fails with exit code 3.
      # The baseline reports are already uploaded as the artifact zap-baseline — they are removed before the API scan.
      - name: Clear the baseline reports
        run: sudo rm -f report_json.json report_md.md report_html.html
      - name: ZAP API scan (every route)
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: http://localhost:3000/api/docs-json
          format: openapi
          rules_file_name: .zap/rules.tsv
          cmd_options: '-a -I'
          allow_issue_writing: ${{ github.event_name == 'schedule' }}
          artifact_name: zap-api
      - name: Logs
        if: failure()
        run: tail -n 200 api.log web.log
