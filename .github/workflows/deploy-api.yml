# Deploys the NestJS API to Cloud Run (private service, IAM only).
# The frontend (Angular SSR) is deployed by Firebase App Hosting automatically from the main branch.
#
# Requires repository variables (Settings → Variables) — printed by infra/bootstrap.sh.
# Authentication — Workload Identity Federation: no JSON keys in GitHub.
name: Deploy API

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/deploy-api.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: military-registry-api
  MIGRATE_JOB: military-registry-migrate
  DAILY_JOB: military-registry-daily
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/military-registry/api:${{ github.sha }}
  # Shared by the service and the migration job
  SECRETS: >-
    DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,DATA_ENCRYPTION_KEY=DATA_ENCRYPTION_KEY:latest,BLIND_INDEX_KEY=BLIND_INDEX_KEY:latest

jobs:
  deploy:
    # Until the infrastructure is set up (infra/bootstrap.sh + repository variables) the deploy is skipped
    # instead of failing on every push to main
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    # Protected by GitHub Environments: required approval, main branch only
    environment: production
    steps:
      - name: Перевірка змінних репозиторію
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}
          GCP_API_SA: ${{ vars.GCP_API_SA }}
          GCP_SQL_INSTANCE: ${{ vars.GCP_SQL_INSTANCE }}
          GCP_BUCKET: ${{ vars.GCP_BUCKET }}
          GCP_WEB_SA: ${{ vars.GCP_WEB_SA }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
        run: |
          missing=""
          for v in GCP_PROJECT_ID GCP_REGION GCP_WIF_PROVIDER GCP_DEPLOY_SA GCP_API_SA GCP_SQL_INSTANCE GCP_BUCKET GCP_WEB_SA APP_ORIGIN ADMIN_EMAIL; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Не задано змінні (Settings → Secrets and variables → Actions → вкладка Variables, не Secrets):$missing"
            echo "Значення друкує infra/bootstrap.sh — див. docs/DEPLOYMENT.md, крок 3."
            exit 1
          fi

      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      # Environment variables go through a YAML/JSON file: values may contain ",", "@", "=" (e.g. an email)
      - name: Змінні середовища для API
        env:
          GCP_BUCKET: ${{ vars.GCP_BUCKET }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          SIGN_WIDGET_SCRIPT_URL: ${{ vars.SIGN_WIDGET_SCRIPT_URL }}
          SIGN_WIDGET_FRAME_URL: ${{ vars.SIGN_WIDGET_FRAME_URL }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
        run: |
          # shared by the migration job and the service
          jq -n --arg bucket "$GCP_BUCKET" '{
            NODE_ENV: "production", COOKIE_SECURE: "true", STORAGE_DRIVER: "gcs", STORAGE_BUCKET: $bucket,
            SWAGGER: "false", DB_MIGRATIONS_RUN: "false"
          }' > "$RUNNER_TEMP/env-common.json"
          # the service additionally needs the frontend origin, the first admin and the signing widget
          jq --arg origin "$APP_ORIGIN" --arg admin "$ADMIN_EMAIL" \
             --arg script "$SIGN_WIDGET_SCRIPT_URL" --arg frame "$SIGN_WIDGET_FRAME_URL" \
             '. + { APP_ORIGIN: $origin, TRUST_PROXY_HOPS: "2", ADMIN_EMAIL: $admin,
                    SIGN_WIDGET_SCRIPT_URL: $script, SIGN_WIDGET_FRAME_URL: $frame }' \
             "$RUNNER_TEMP/env-common.json" > "$RUNNER_TEMP/env-service.json.tmp"
          # e-mail sender (GitHub variable MAIL_FROM); the SMTP password lives in the secret SMTP_URL
          jq --arg from "$MAIL_FROM" '. + { MAIL_FROM: $from }' "$RUNNER_TEMP/env-service.json.tmp" > "$RUNNER_TEMP/env-service.json"
          jq 'keys' "$RUNNER_TEMP/env-service.json"
          # SMTP is optional: the secret is attached only if it was created (see docs/DEPLOYMENT.md)
          if gcloud secrets describe SMTP_URL >/dev/null 2>&1; then
            echo "SMTP_SECRET=,SMTP_URL=SMTP_URL:latest" >> "$GITHUB_ENV"
          else
            echo "::warning::Секрет SMTP_URL не створено — листи-нагадування вимкнені"
            echo "SMTP_SECRET=" >> "$GITHUB_ENV"
          fi

      - name: Збірка і публікація образу
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" backend
          docker push "$IMAGE"

      - name: Міграції БД (Cloud Run Job) — до перемикання трафіку
        run: |
          gcloud run jobs deploy "$MIGRATE_JOB" \
            --image "$IMAGE" --region "$REGION" \
            --service-account "${{ vars.GCP_API_SA }}" \
            --set-cloudsql-instances "${{ vars.GCP_SQL_INSTANCE }}" \
            --set-secrets "$SECRETS" \
            --env-vars-file "$RUNNER_TEMP/env-common.json" \
            --command node --args dist/database/migrate.js \
            --max-retries 0 --task-timeout 10m --quiet
          gcloud run jobs execute "$MIGRATE_JOB" --region "$REGION" --wait

      - name: Деплой сервісу (без публічного доступу)
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" --region "$REGION" \
            --service-account "${{ vars.GCP_API_SA }}" \
            --no-allow-unauthenticated \
            --set-cloudsql-instances "${{ vars.GCP_SQL_INSTANCE }}" \
            --set-secrets "$SECRETS,ADMIN_PASSWORD=ADMIN_PASSWORD:latest${SMTP_SECRET}" \
            --env-vars-file "$RUNNER_TEMP/env-service.json" \
            --cpu 1 --memory 512Mi --concurrency 40 \
            --min-instances 0 --max-instances 4 --timeout 60 \
            --execution-environment gen2 --cpu-boost --quiet

      - name: Доступ до API лише для фронтенду (App Hosting)
        run: |
          gcloud run services add-iam-policy-binding "$SERVICE" --region "$REGION" \
            --member "serviceAccount:${{ vars.GCP_WEB_SA }}" --role roles/run.invoker --quiet >/dev/null
          # make sure there is no public access
          if gcloud run services get-iam-policy "$SERVICE" --region "$REGION" --format=json | grep -q '"allUsers"'; then
            echo "::error::API доступний публічно (allUsers) — це заборонено"; exit 1
          fi
          echo "API: $(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')"

      # Daily job: mobilization term from the decrees + e-mail reminders (deferral / reservation ending)
      - name: Щоденна задача (Cloud Run Job + Cloud Scheduler)
        run: |
          gcloud run jobs deploy "$DAILY_JOB" \
            --image "$IMAGE" --region "$REGION" \
            --service-account "${{ vars.GCP_API_SA }}" \
            --set-cloudsql-instances "${{ vars.GCP_SQL_INSTANCE }}" \
            --set-secrets "${SECRETS}${SMTP_SECRET}" \
            --env-vars-file "$RUNNER_TEMP/env-service.json" \
            --command node --args dist/jobs/daily.js \
            --max-retries 1 --task-timeout 10m --quiet
          gcloud run jobs add-iam-policy-binding "$DAILY_JOB" --region "$REGION" \
            --member "serviceAccount:${{ vars.GCP_API_SA }}" --role roles/run.invoker --quiet >/dev/null
          URI="https://run.googleapis.com/v2/projects/${{ vars.GCP_PROJECT_ID }}/locations/${REGION}/jobs/${DAILY_JOB}:run"
          if gcloud scheduler jobs describe "$DAILY_JOB" --location "$REGION" >/dev/null 2>&1; then verb=update; else verb=create; fi
          gcloud scheduler jobs "$verb" http "$DAILY_JOB" --location "$REGION" \
            --schedule "0 7 * * *" --time-zone "Europe/Kyiv" \
            --uri "$URI" --http-method POST \
            --oauth-service-account-email "${{ vars.GCP_API_SA }}" --quiet
          echo "Щоденна задача: щодня о 07:00 (Київ)"
