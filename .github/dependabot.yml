version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      nestjs: { patterns: ['@nestjs/*'] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      angular: { patterns: ['@angular/*', '@angular-devkit/*'] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
