# Firebase App Hosting — Angular SSR (frontend).
# Values marked REPLACE are filled in after infra/bootstrap.sh (see docs/DEPLOYMENT.md).
# No secrets here: the frontend has no access to the DB or keys — only to the private API.

runConfig:
  cpu: 1
  memoryMiB: 1024
  concurrency: 80
  minInstances: 0 # 1 — no cold start in the morning (paid)
  maxInstances: 4

env:
  # Private Cloud Run with the NestJS API (gcloud run services describe military-registry-api --format='value(status.url)')
  - variable: API_INTERNAL_URL
    value: https://military-registry-api-REPLACE.europe-west4.run.app
    availability: [RUNTIME]

  # API calls carry the ID token of the App Hosting service account (the API has no public access)
  - variable: API_AUTH
    value: google-id-token
    availability: [RUNTIME]

  # SSR calls the API through our own proxy (it adds the IAM token); App Hosting listens on port 8080
  - variable: SSR_API_BASE
    value: http://127.0.0.1:8080
    availability: [RUNTIME]

  # Hosts allowed for SSR (SSRF protection). App Hosting sets NG_ALLOWED_HOSTS itself
  # (its *.hosted.app and *.run.app domains). Only when a custom domain is connected, uncomment
  # and list ALL hosts — this value replaces the automatic one:
  # - variable: NG_ALLOWED_HOSTS
  #   value: people-accounting--accounting-project-1aecf.europe-west4.hosted.app,hr.company.ua
  #   availability: [RUNTIME]

  # Number of Google proxies in front of the container — for the correct client IP (see docs/SECURITY.md)
  - variable: TRUST_PROXY_HOPS
    value: "2"
    availability: [RUNTIME]

  # The IIT signing widget may be embedded in a frame
  - variable: CSP_FRAME_SRC
    value: https://eu.iit.com.ua
    availability: [RUNTIME]

  # Optional: access only from company networks (office, VPN). Empty — from any address.
  # - variable: ALLOWED_CLIENT_CIDRS
  #   value: 203.0.113.0/24
  #   availability: [RUNTIME]
