# Firebase App Hosting — Angular SSR (фронтенд).
# Значення з позначкою REPLACE заповнюються після infra/bootstrap.sh (див. docs/DEPLOYMENT.md).
# Секретів тут немає: фронтенд не має доступу ні до БД, ні до ключів — лише до приватного API.

runConfig:
  cpu: 1
  memoryMiB: 1024
  concurrency: 80
  minInstances: 0 # 1 — без «холодного старту» вранці (платно)
  maxInstances: 4

env:
  # Приватний Cloud Run з NestJS API (gcloud run services describe military-registry-api --format='value(status.url)')
  - variable: API_INTERNAL_URL
    value: https://military-registry-api-REPLACE.europe-west4.run.app
    availability: [RUNTIME]

  # Виклики API з ID-токеном сервісного акаунта App Hosting (API без публічного доступу)
  - variable: API_AUTH
    value: google-id-token
    availability: [RUNTIME]

  # SSR звертається до API через власний проксі (він додає IAM-токен); App Hosting слухає порт 8080
  - variable: SSR_API_BASE
    value: http://127.0.0.1:8080
    availability: [RUNTIME]

  # Хости, для яких дозволено SSR (захист від SSRF): домен App Hosting і власний домен
  - variable: NG_ALLOWED_HOSTS
    value: military-registry-web--REPLACE-PROJECT.europe-west4.hosted.app,oblik.example.ua
    availability: [RUNTIME]

  # Кількість проксі Google перед контейнером — для коректного IP клієнта (див. docs/SECURITY.md)
  - variable: TRUST_PROXY_HOPS
    value: "2"
    availability: [RUNTIME]

  # Віджет підпису ІІТ дозволено вбудовувати фреймом
  - variable: CSP_FRAME_SRC
    value: https://eu.iit.com.ua
    availability: [RUNTIME]

  # Необов'язково: доступ лише з мереж компанії (офіс, VPN). Порожньо — з будь-якої адреси.
  # - variable: ALLOWED_CLIENT_CIDRS
  #   value: 203.0.113.0/24
  #   availability: [RUNTIME]
