<label class="block">
  <span class="label">
    {{ label() }}
    @if (required()) {
      <span class="text-danger">*</span>
    }
  </span>
  <ng-content />
</label>
@if (errors().length) {
  <p class="mt-1 text-xs text-danger" role="alert">{{ errors()[0] }}</p>
} @else if (warning()) {
  <p class="mt-1 text-xs text-warning">{{ warning() }}</p>
} @else if (hint()) {
  <p class="mt-1 text-xs text-muted">{{ hint() }}</p>
}
