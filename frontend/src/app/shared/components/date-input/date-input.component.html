<div #root class="relative">
  <input
    #textField
    class="input pr-10 tabular-nums"
    inputmode="numeric"
    autocomplete="off"
    maxlength="10"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-invalid]="invalid() || null"
    [placeholder]="placeholder()"
    [value]="text()"
    [disabled]="disabled()"
    [readOnly]="readonly()"
    (input)="onInput($event)"
    (blur)="onBlur()"
    (keydown.alt.arrowdown)="toggle()"
  />
  <button
    type="button"
    class="absolute top-1/2 right-1.5 -translate-y-1/2 rounded-md p-1.5 text-muted hover:bg-sunken hover:text-ink disabled:opacity-40"
    aria-label="Відкрити календар"
    [attr.aria-expanded]="open()"
    [disabled]="disabled() || readonly()"
    (click)="toggle()"
  >
    <svg
      viewBox="0 0 24 24"
      class="size-4"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    >
      <rect x="3" y="5" width="18" height="16" rx="2" />
      <path d="M16 3v4M8 3v4M3 10h18" />
    </svg>
  </button>

  @if (open()) {
    <div
      class="absolute left-0 z-40 mt-1 w-72 rounded-xl border border-line bg-surface p-3 shadow-lg"
      role="dialog"
      aria-label="Вибір дати"
    >
      <div class="mb-2 flex items-center gap-1">
        <button
          type="button"
          class="rounded-md p-1.5 hover:bg-sunken"
          aria-label="Попередній місяць"
          (click)="shift(-1)"
        >
          <svg
            viewBox="0 0 24 24"
            class="size-4"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="m15 18-6-6 6-6" />
          </svg>
        </button>
        <select
          class="min-w-0 flex-1 rounded-md border border-line bg-surface px-1.5 py-1 text-sm"
          aria-label="Місяць"
          (change)="setMonth($any($event.target).value)"
        >
          @for (m of months; track m; let i = $index) {
            <option [value]="i + 1" [selected]="view().month === i + 1">{{ m }}</option>
          }
        </select>
        <select
          class="w-20 rounded-md border border-line bg-surface px-1.5 py-1 text-sm tabular-nums"
          aria-label="Рік"
          (change)="setYear($any($event.target).value)"
        >
          @for (y of years(); track y) {
            <option [value]="y" [selected]="view().year === y">{{ y }}</option>
          }
        </select>
        <button
          type="button"
          class="rounded-md p-1.5 hover:bg-sunken"
          aria-label="Наступний місяць"
          (click)="shift(1)"
        >
          <svg
            viewBox="0 0 24 24"
            class="size-4"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="m9 18 6-6-6-6" />
          </svg>
        </button>
      </div>
      <div class="grid grid-cols-7 gap-0.5 text-center text-xs">
        @for (w of weekdays; track w) {
          <span class="py-1 font-medium text-muted">{{ w }}</span>
        }
        @for (_ of days().offset; track $index) {
          <span></span>
        }
        @for (c of days().cells; track c.iso) {
          <button
            type="button"
            class="rounded-md py-1.5 text-sm tabular-nums"
            [class]="
              c.selected
                ? 'bg-brand-600 font-semibold text-white'
                : c.today
                  ? 'font-semibold text-brand-700 ring-1 ring-brand-500 ring-inset hover:bg-brand-50'
                  : 'hover:bg-sunken'
            "
            [attr.aria-pressed]="c.selected"
            (click)="pick(c.iso)"
          >
            {{ c.day }}
          </button>
        }
      </div>
      <div class="mt-2 flex justify-between border-t border-line pt-2 text-sm">
        <button type="button" class="text-brand-600 hover:underline" (click)="today()">
          Сьогодні
        </button>
        <button type="button" class="text-muted hover:underline" (click)="clear()">Очистити</button>
      </div>
    </div>
  }
</div>
