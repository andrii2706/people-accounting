<div class="mx-auto max-w-lg py-16">
  <div class="card p-8">
    <span class="grid size-11 place-items-center rounded-lg bg-brand-100 text-brand-700"
      ><app-icon name="shield" [size]="22"
    /></span>
    <h1 class="mt-5 text-xl font-semibold">Обліковий запис ще не прив’язано до юридичної особи</h1>
    <p class="mt-3 text-sm text-muted">
      Кожен обліковий запис працює з даними лише своєї юридичної особи. Зверніться до головного
      адміністратора — він вкаже, до якої юрособи належить ваш запис ({{ auth.user()?.email }}).
    </p>
    <a routerLink="/profile" class="btn btn-secondary mt-6 cursor-pointer"
      ><app-icon name="key" /> Мій профіль</a
    >
  </div>
</div>
