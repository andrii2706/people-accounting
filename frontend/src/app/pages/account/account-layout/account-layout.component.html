<header
  class="flex items-center justify-between gap-3 border-b border-line bg-surface px-4 py-3 sm:px-6"
>
  <a routerLink="/" class="flex items-center gap-3 cursor-pointer">
    <span class="grid size-9 place-items-center rounded-[10px] bg-brand-600 text-white"
      ><app-icon name="shield" [size]="18"
    /></span>
    <span class="leading-tight">
      <span class="block font-semibold">Військовий облік</span>
      <span class="block text-xs text-muted">{{ auth.user()?.fullName }}</span>
    </span>
  </a>
  <button type="button" class="btn btn-ghost cursor-pointer" (click)="auth.logout()">
    <app-icon name="logout" /> Вийти
  </button>
</header>
<main class="mx-auto w-full max-w-5xl flex-1 px-4 py-8 sm:px-6">
  <router-outlet />
</main>
<app-copyright class="pb-6" />
